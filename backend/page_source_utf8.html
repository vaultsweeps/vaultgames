<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cashier</title>
    <style>
        :root {
            --bg: #edf5f2;
            --bg-soft: #f8fbfa;
            --card: rgba(255, 255, 255, 0.94);
            --ink: #12201d;
            --muted: #687b75;
            --line: #dce9e5;
            --accent: #1f8a70;
            --accent-dark: #11624f;
            --accent-soft: #e4f4ef;
            --warn-bg: #fff3f1;
            --warn-text: #9b2f24;
            --shadow: 0 22px 60px rgba(31, 83, 70, 0.14);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }

        body {
            min-height: 100vh;
            color: var(--ink);
            line-height: 1.5;
            background:
                radial-gradient(circle at top left, rgba(169, 223, 207, 0.55), transparent 34rem),
                linear-gradient(180deg, #f9fcfb 0%, var(--bg) 100%);
        }

        .page-shell {
            width: 100%;
            min-height: 100vh;
            padding: 16px 10px 22px;
        }

        .header-banner {
            color: var(--ink);
        }

        .header-content {
            width: 100%;
            max-width: 480px;
            margin: 0 auto 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }

        .brand-lockup {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-mark {
            width: 38px;
            height: 38px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            color: #ffffff;
            background: linear-gradient(145deg, var(--accent), #6dbda8);
            box-shadow: 0 10px 24px rgba(31, 138, 112, 0.28);
        }

        .brand-mark svg {
            width: 20px;
            height: 20px;
        }

        .logo {
            font-size: 18px;
            font-weight: 750;
            letter-spacing: 0;
        }

        .logo_t {
            color: var(--muted);
            font-size: 12px;
            font-weight: 600;
        }

        .status-pill {
            flex: 0 0 auto;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 8px 11px;
            border: 1px solid rgba(31, 138, 112, 0.18);
            border-radius: 999px;
            color: var(--accent-dark);
            background: rgba(255, 255, 255, 0.72);
            font-size: 12px;
            font-weight: 700;
            box-shadow: 0 10px 30px rgba(34, 82, 72, 0.08);
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #36b58f;
            box-shadow: 0 0 0 4px rgba(54, 181, 143, 0.14);
        }

        .container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
        }

        .form-container {
            overflow: hidden;
            border: 1px solid rgba(220, 233, 229, 0.9);
            border-radius: 24px;
            background: var(--card);
            box-shadow: var(--shadow);
            backdrop-filter: blur(14px);
        }

        .checkout-hero {
            padding: 24px 22px 18px;
            background:
                linear-gradient(135deg, rgba(228, 244, 239, 0.96) 0%, rgba(255, 255, 255, 0.86) 100%);
            border-bottom: 1px solid var(--line);
        }

        .hero-label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--accent-dark);
            font-size: 12px;
            font-weight: 750;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .hero-label::before {
            content: "";
            width: 8px;
            height: 8px;
            border-radius: 999px;
            background: var(--accent);
        }

        .hero-title {
            margin-top: 12px;
            color: var(--ink);
            font-size: 28px;
            line-height: 1.08;
            font-weight: 780;
            letter-spacing: 0;
        }

        .payment-form {
            padding: 14px 14px 16px;
        }

        .form-section {
            padding: 13px 12px;
            border: 1px solid var(--line);
            border-radius: 18px;
            background: #ffffff;
        }

        .form-section + .form-section {
            margin-top: 12px;
        }

        .section-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 11px;
        }

        .section-title {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            color: var(--ink);
            font-size: 15px;
            font-weight: 760;
        }

        .section-icon,
        .note-icon {
            width: 28px;
            height: 28px;
            flex: 0 0 auto;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            color: var(--accent-dark);
            background: var(--accent-soft);
        }

        .section-icon svg,
        .note-icon svg {
            width: 15px;
            height: 15px;
        }

        .section-note {
            color: var(--muted);
            font-size: 12px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 11px;
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        .form-label {
            display: block;
            margin-bottom: 6px;
            color: #324641;
            font-size: 13px;
            font-weight: 720;
        }

        .form-input {
            width: 100%;
            min-height: 44px;
            padding: 10px 12px;
            border: 1px solid #d8e4e0;
            border-radius: 14px;
            color: var(--ink);
            background: var(--bg-soft);
            font-size: 16px;
            transition: border-color 0.18s ease, box-shadow 0.18s ease, background-color 0.18s ease;
            appearance: none;
        }

        select.form-input {
            background-image:
                linear-gradient(45deg, transparent 50%, var(--muted) 50%),
                linear-gradient(135deg, var(--muted) 50%, transparent 50%);
            background-position:
                calc(100% - 18px) 19px,
                calc(100% - 13px) 19px;
            background-size: 5px 5px, 5px 5px;
            background-repeat: no-repeat;
            padding-right: 40px;
        }

        .form-input::placeholder {
            color: #95a8a2;
        }

        .form-input:focus {
            border-color: rgba(31, 138, 112, 0.78);
            box-shadow: 0 0 0 4px rgba(31, 138, 112, 0.11);
            outline: none;
            background: #ffffff;
        }

        .form-row {
            display: flex;
            gap: 14px;
        }

        .form-col {
            flex: 1;
        }

        .radio-group {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
            margin-top: 7px;
        }

        .radio-option {
            position: relative;
            min-height: 46px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border: 1px solid #d8e4e0;
            border-radius: 14px;
            background: var(--bg-soft);
            color: #263c36;
            font-weight: 700;
        }

        .radio-option input {
            width: 18px;
            height: 18px;
            margin: 0;
            accent-color: var(--accent);
        }

        .radio-option:has(input:checked) {
            border-color: rgba(31, 138, 112, 0.58);
            background: var(--accent-soft);
            box-shadow: inset 0 0 0 1px rgba(31, 138, 112, 0.12);
        }

        .method-meta {
            margin-left: auto;
            color: var(--muted);
            font-size: 12px;
            font-weight: 650;
        }

        textarea.form-input {
            min-height: 70px;
            resize: none;
            line-height: 1.45;
        }

        .secure-note {
            margin-top: 12px;
            padding: 11px 14px;
            border-radius: 16px;
            color: #405650;
            background: #f4faf8;
            border: 1px solid var(--line);
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-align: left;
        }

        .secure-note span:last-child {
            max-width: 320px;
        }

        .submit-btn {
            width: 100%;
            min-height: 50px;
            margin-top: 14px;
            border: none;
            border-radius: 16px;
            color: #ffffff;
            background: linear-gradient(135deg, var(--accent-dark), var(--accent));
            box-shadow: 0 16px 34px rgba(31, 138, 112, 0.28);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            font-size: 16px;
            font-weight: 780;
            letter-spacing: 0;
            transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
        }

        .button-icon {
            width: 18px;
            height: 18px;
            flex: 0 0 auto;
        }

        .submit-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 18px 38px rgba(31, 138, 112, 0.32);
            filter: saturate(1.04);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .error-message {
            margin: 0 0 14px;
            padding: 14px;
            border: 1px solid #ffd5ce;
            border-radius: 16px;
            color: var(--warn-text);
            background: var(--warn-bg);
            font-size: 14px;
        }

        #error {
            width: 100%;
            max-width: 480px;
            margin: 40px auto 0;
            padding: 24px;
            border: 1px solid var(--line);
            border-radius: 20px;
            color: var(--muted);
            background: #ffffff;
            text-align: center;
        }

        @media (max-width: 420px) {
            .page-shell {
                padding: 10px 8px 16px;
            }

            .header-content {
                margin-bottom: 10px;
            }

            .status-pill {
                padding: 7px 9px;
                font-size: 11px;
            }

            .checkout-hero,
            .payment-form {
                padding-left: 10px;
                padding-right: 10px;
            }

            .hero-title {
                font-size: 25px;
            }

            .form-section {
                padding: 12px 10px;
            }
        }
    </style>
</head>

	<script>
	const paymentAmounts = {
	    1: ["4.99","5.99","6.99","7.99","8.99","9.99","10.99","11.99","12.99","13.99","14.99","17.99","19.99","22.99","24.99","29.99","30.99","32.99","39.99","49.99","54.99","59.99","99.99","109.99","124.99","129.99","149.99","199.99","249.99","299.99","399.99","499.99"],
	    2: ["4.99","5.99","6.99","7.99","8.99","9.99","10.99","11.99","12.99","13.99","14.99","17.99","19.99","22.99","24.99","29.99","30.99","32.99","39.99","49.99","54.99","59.99","99.99","109.99","124.99","129.99","149.99","199.99","249.99","299.99","399.99","499.99"],
	    3: ["4.99","5.99","6.99","7.99","8.99","9.99","10.99","11.99","12.99","13.99","14.99","17.99","19.99","22.99","24.99","29.99","30.99","32.99","39.99","49.99","54.99","59.99","99.99","109.99","124.99","129.99","149.99","199.99","249.99","299.99","399.99","499.99"],
	    4: ["9.99","10.99","11.99","12.99","13.99","14.99","17.99","19.99","22.99","24.99","29.99","30.99","32.99","39.99","49.99","54.99","59.99","99.99","109.99","124.99","129.99","149.99","199.99"]	};
	const paymentTypeSelect = document.getElementById('is_pay');
	const amountSelect = document.getElementById('amount');
	const paymentForm = document.querySelector('.payment-form');
	const initialAmount = "-1";
	const redirectUrl = "";

	function updateAmountOptions(preferredAmount) {
	    const paymentType = paymentTypeSelect.value;
	    const amounts = paymentAmounts[paymentType] || [];
	    amountSelect.innerHTML = '';
	    const placeholder = document.createElement('option');
	    placeholder.value = '-1';
	    placeholder.textContent = 'Select amount';
	    amountSelect.appendChild(placeholder);
	    amounts.forEach(function(amount) {
	        const option = document.createElement('option');
	        option.value = amount;
	        option.textContent = amount;
	        amountSelect.appendChild(option);
	    });
	    amountSelect.disabled = !paymentType;
	    amountSelect.value = amounts.indexOf(preferredAmount) !== -1 ? preferredAmount : '-1';
	}

	paymentTypeSelect.addEventListener('change', function() {
	    updateAmountOptions(amountSelect.value);
	});
	paymentForm.addEventListener('submit', function(event) {
	    const amounts = paymentAmounts[paymentTypeSelect.value] || [];
	    if (!paymentTypeSelect.value) {
	        event.preventDefault();
	        alert('Please select a payment type');
	        paymentTypeSelect.focus();
	        return;
	    }
	    if (amountSelect.value === '-1' || amounts.indexOf(amountSelect.value) === -1) {
	        event.preventDefault();
	        alert('Please select a valid amount');
	        amountSelect.focus();
	    }
	});
	updateAmountOptions(initialAmount);
	if (redirectUrl) {
	    window.location.replace(redirectUrl);
	}

	ismobile = isMobileDevice();
     if(ismobile === false){
        window.location.href = '/index.html';
     }
     function isMobileDevice() {
        var userAgent = navigator.userAgent || navigator.vendor || window.opera;
        // alert(userAgent);
        // σ╕╕ΦºüτÜäτº╗σè¿Φ«╛σñçµáçΦ»å
        var isMobile = /iPhone|iPod|iPad|Android|BlackBerry|BB10|Silk|Mobi|webOS|IEMobile|Opera Mini/i.test(userAgent);

        return isMobile;
    }
        function getCookie(name) {
            let value = "; " + document.cookie;
            let parts = value.split("; " + name + "=");
            if (parts.length === 2) return parts.pop().split(";").shift();
            return undefined;
        }
        // var uniqueID = getCookie('deviceID');
        // if (uniqueID !== undefined) {
            document.getElementById('cashier').style.display = "";
            document.getElementById('error').style.display = "none";
        // }else{
        //     window.location.href = '/index.html';
        // }
    </script>
